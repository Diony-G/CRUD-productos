<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Productos</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <h1>Inventario de productos</h1>

    <h3 id="titulo">Nuevo producto</h3>
    <form id="form">
        <input name="codigo" placeholder="Código" maxlength="20" required>
        <input name="nombre" placeholder="Nombre" maxlength="100" required>
        <select name="categoria" required>
            <option value="">Categoría...</option>
            <option>Electrónica</option>
            <option>Hogar</option>
            <option>Oficina</option>
            <option>Otros</option>
        </select>
        <input name="precio" type="number" step="0.01" min="0.01" placeholder="Precio" required>
        <input name="stock" type="number" step="1" min="0" placeholder="Stock" required>
        <button>Guardar</button>
        <button type="reset">Cancelar</button>
    </form>

    <p id="resumen"></p>
    <div class="tabla">
        <table>
            <thead>
                <tr><th>Código</th><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Acciones</th></tr>
            </thead>
            <tbody id="lista"></tbody>
        </table>
    </div>

    <script>
        const api = '/api/productos';
        let editando = null;

        async function cargar() {
            const productos = await (await fetch(api)).json();

            lista.replaceChildren();
            let valor = 0;
            for (const p of productos) {
                valor += p.precio * p.stock;
                const fila = lista.insertRow();
                if (p.stock <= 5) fila.className = 'bajo';
                for (const texto of [p.codigo, p.nombre, p.categoria, p.precio.toFixed(2), p.stock])
                    fila.insertCell().textContent = texto;
                fila.insertCell().append(
                    boton('Editar', () => editar(p)),
                    boton('Eliminar', () => eliminar(p)));
            }
            resumen.textContent = `Productos: ${productos.length} | Valor del inventario: ${valor.toFixed(2)}`;
        }

        function boton(texto, accion) {
            const b = document.createElement('button');
            b.textContent = texto;
            b.onclick = accion;
            return b;
        }

        function editar(p) {
            editando = p.id;
            titulo.textContent = `Editando ${p.codigo}`;
            for (const campo of ['codigo', 'nombre', 'categoria', 'precio', 'stock'])
                form.elements[campo].value = p[campo];
        }

        async function eliminar(p) {
            if (!confirm(`¿Eliminar ${p.nombre}?`)) return;
            await fetch(`${api}/${p.id}`, { method: 'DELETE' });
            if (editando === p.id) form.reset();
            cargar();
        }

        form.onsubmit = async e => {
            e.preventDefault();
            const datos = Object.fromEntries(new FormData(form));
            datos.precio = Number(datos.precio);
            datos.stock = Number(datos.stock);
            const res = await fetch(editando ? `${api}/${editando}` : api, {
                method: editando ? 'PUT' : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            });
            if (!res.ok) return alert(await res.json().catch(() => 'No se pudo guardar'));
            form.reset();
            cargar();
        };

        form.onreset = () => {
            editando = null;
            titulo.textContent = 'Nuevo producto';
        };

        cargar();
    </script>
</body>
</html>
